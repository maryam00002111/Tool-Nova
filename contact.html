<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact ToolNova</title>
<meta name="description" content="Get in touch with the ToolNova team — report a bug, request a tool, or ask a question.">
<link rel="canonical" href="https://toolnova.app/contact.html">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo-lockup"><img src="assets/logo-mark.svg" alt="ToolNova logo" class="logo-mark">Tool<span class="accent">Nova</span></a>
    <div class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="blog.html">Blog</a><a href="about.html">About</a></div>
    <div class="nav-actions"><button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☾</button><button class="nav-burger" id="navBurger" aria-label="Open menu">☰</button></div>
  </div>
</nav>
<div class="container">
  <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span>Contact</span></div>
  <section class="section" style="max-width:560px;">
    <h1 style="font-size:32px;margin-bottom:10px;">Get in touch</h1>
    <p style="color:var(--muted);margin-bottom:26px;">Found a bug, or want a tool that isn't here yet? Send us a note.</p>
    <form onsubmit="event.preventDefault(); tnToast('Message sent — thank you!', 'success'); this.reset();" style="display:flex;flex-direction:column;gap:14px;">
      <input type="text" required placeholder="Your name">
      <input type="email" required placeholder="Your email">
      <textarea required placeholder="What's on your mind?" style="min-height:140px;"></textarea>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
  </section>
</div>
<footer><div class="container"><div class="footer-bottom"><span>© 2026 ToolNova. All rights reserved.</span><a href="index.html">Back to home</a></div></div></footer>
<button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>
<script src="assets/main.js"></script>
</body>
</html>
